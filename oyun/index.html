<script>
(() => {
  const root = document.documentElement;
  try {
    if (sessionStorage.getItem('gunlugum:intro-seen') === '1') {
      root.classList.add('intro-loader-skip');
      return;
    }
    sessionStorage.setItem('gunlugum:intro-seen', '1');
  } catch (_) {}
  root.classList.add('intro-loader-active');
  window.__gunlugumLoaderStart = performance.now();
  // Diğer betik yüklenmezse de ekran açık kalmasın.
  window.__gunlugumLoaderFallback = window.setTimeout(() => {
    root.classList.add('intro-loader-fade');
    root.classList.remove('intro-loader-active');
    window.setTimeout(() => {
      document.getElementById('siteIntroLoader')?.remove();
      root.classList.remove('intro-loader-fade');
    }, 240);
  }, 1500);
})();
</script>

<style>
  /* Maliyet ve Kütüphane düğmesi: sola hizalama ve zarif hover animasyonu */
  .library-action {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    margin: 4px 0 12px;
  }

  .library-action__link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transform: translateY(0) scale(1);
    transform-origin: left center;
    transition:
      transform 200ms cubic-bezier(.2,.75,.25,1),
      box-shadow 200ms ease,
      border-color 200ms ease,
      background-color 200ms ease;
    will-change: transform;
  }

  .library-action__link:hover {
    transform: translateY(-3px) scale(1.025);
    border-color: var(--acc);
    box-shadow: 0 8px 20px color-mix(in srgb, var(--acc) 23%, transparent);
  }

  .library-action__link:active {
    transform: translateY(-1px) scale(.99);
  }

  .library-action__link:focus-visible {
    outline: 2px solid var(--acc);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .library-action__link {
      transition: none;
      will-change: auto;
    }
    .library-action__link:hover,
    .library-action__link:active {
      transform: none;
    }
  }
</style>


<script src="../scripts/pwa.js?v=3" defer></script>
