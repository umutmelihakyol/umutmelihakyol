<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Yönetim</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script>document.write('<script src="config.js?'+Date.now()+'"><\/script>')</script>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Oyun ekle</h1><span><button class="btn" id="out" hidden>Çıkış</button> <a class="btn" href="index.html">Siteye dön</a></span></header>

  <section class="panel" id="gate">
    <div id="login">
      <h2>Giriş</h2>
      <div class="f"><label class="wide">Şifre<input id="pw" type="password" autocomplete="current-password"></label></div>
      <p><button class="btn pri" id="in">Giriş yap</button></p>
    </div>
    <div id="setup" hidden>
      <h2>İlk kurulum</h2>
      <p class="meta">GitHub anahtarını (token) ve seçtiğin şifreyi gir. Anahtar şifrelenir. Çıkan metni <b>config.js</b> içindeki <b>vault</b> alanına yapıştırıp siteyi yeniden yükle. Şifre en az 12 karakter olsun.</p>
      <div class="f"><label class="wide">GitHub token<input id="tok" type="password" autocomplete="off"></label>
      <label>Yeni şifre<input id="pw1" type="password" autocomplete="new-password"></label>
      <label>Şifre (tekrar)<input id="pw2" type="password" autocomplete="new-password"></label>
      <label class="wide">Şifreli anahtar<textarea id="vout" rows="3" readonly></textarea></label></div>
      <p><button class="btn pri" id="mk">Şifreli anahtar oluştur</button></p>
    </div>
    <p class="msg" id="gmsg" role="status"></p>
  </section>
<div id="app" hidden>

  <section class="panel">
    <h2>Oyun ara (kapak görseli otomatik gelir)</h2>
    <div class="f"><label class="wide">Oyun adı<input id="s" placeholder="örn. Hades"></label></div>
    <p><button class="btn" id="go">Ara</button></p>
    <div class="res" id="res"></div>
  </section>

  <section class="panel">
    <h2 id="ft">Oyun bilgileri</h2>
    <div class="f">
      <label>Durum<select id="status"><option value="bitirdim">Bitirdim</option><option value="oynuyorum">Oynuyorum</option><option value="biraktim">Yarım bıraktım</option><option value="istek">İstek listesi</option></select></label>
      <label>Oyun adı<input id="title"></label>
      <label>Platform (birden fazlaysa virgülle)<input id="platform" placeholder="PC, PS5, Switch…"></label>
      <label class="wide">Türler (virgülle ayır)<input id="genres" placeholder="Aksiyon, Macera"></label>
      <label>Puanım (0-10, bitirdiysen zorunlu)<input id="score" type="number" min="0" max="10" step="0.5"></label>
      <label>Bitirme süresi (saat)<input id="hours" type="number" min="0" step="0.5"></label>
      <label>Bitirdiğim tarih<input id="finished" type="date"></label>
      <label>Öneriyor muyum?<select id="rec"><option value="1">Evet</option><option value="0">Hayır</option><option value="">Belirtme</option></select></label>
      <label class="wide">İnceleme bağlantısı (yoksa boş bırak)<input id="review" type="url" placeholder="https://…"></label>
      <label class="wide">Kapak görseli adresi<input id="image" type="url" placeholder="Arama ile otomatik dolar"></label>
      <label class="wide">Kısa not<textarea id="note" rows="2"></textarea></label>
    </div>
    <p><button class="btn pri" id="add">Kaydet</button> <button class="btn" id="clr">Formu temizle</button></p>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="panel"><h2>Kayıtlı oyunlar</h2><div id="list"></div>
    <p><button class="btn" id="dl">games.json indir (yedek)</button></p></section>
</div>
</div>
<script>
const C=window.CONFIG,$=s=>document.querySelector(s),ids=['title','platform','score','hours','finished','review','image','note'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={bitirdim:'Bitirdim',oynuyorum:'Oynuyorum',biraktim:'Yarım bıraktım',istek:'İstek listesi'};
const TR={Action:'Aksiyon',Adventure:'Macera',RPG:'RPG',Strategy:'Strateji',Shooter:'Nişancı',Puzzle:'Bulmaca',Platformer:'Platform',Racing:'Yarış',Sports:'Spor',Simulation:'Simülasyon',Indie:'Bağımsız',Fighting:'Dövüş',Casual:'Rahat',Arcade:'Arcade','Massively Multiplayer':'MMO',Family:'Aile','Board Games':'Masa oyunu',Card:'Kart',Educational:'Eğitici'};
let games=[],sha=null,editId=null;
let T=sessionStorage.getItem('gh_t')||'';const tok=()=>T;
const api=`https://api.github.com/repos/${C.owner}/${C.repo}/contents/${C.path}`;
const hdr=()=>({Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json'});
const say=(t,bad)=>{const m=$('#msg');m.textContent=t;m.style.color=bad?'var(--no)':'var(--yes)'};
const enc=new TextEncoder(),dec=new TextDecoder(),b64=u=>btoa(String.fromCharCode(...u)),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(tk,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),enc.encode(tk)));return [b64(salt),b64(iv),b64(ct)].join('.')}
async function unseal(v,pw){const [s,i,c]=v.split('.').map(unb);return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:i},await key(pw,s),c))}
const gsay=(t,bad)=>{const m=$('#gmsg');m.textContent=t;m.style.color=bad?'var(--no)':'var(--yes)'};
function unlock(){$('#gate').hidden=true;$('#app').hidden=false;$('#out').hidden=false;load()}
$('#in').onclick=async()=>{
  const v=(C.vault||'').trim().replace(/^["']|["']$/g,'');
  try{T=await unseal(v,$('#pw').value)}
  catch(e){return gsay(e.name==='OperationError'?'Şifre yanlış ya da config.js içindeki vault başka bir şifreyle üretilmiş. Sayfayı Ctrl+F5 ile yenileyip tekrar dene. Sorun sürerse admin.html#kurulum adresinden yeni vault üret.':'config.js içindeki vault metni bozuk. Metnin tamamını, tırnakların arasına tek satır olarak yapıştırdığından emin ol.',1)}
  try{sessionStorage.setItem('gh_t',T)}catch{}
  unlock();
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#in').click()});
$('#out').onclick=()=>{sessionStorage.removeItem('gh_t');location.reload()};
$('#mk').onclick=async()=>{const t=$('#tok').value.trim(),p=$('#pw1').value;
  if(!t)return gsay('Token boş.',1);if(p.length<12)return gsay('Şifre en az 12 karakter olmalı.',1);if(p!==$('#pw2').value)return gsay('Şifreler aynı değil.',1);
  const v=await seal(t,p);try{await unseal(v,p)}catch{return gsay('Doğrulama başarısız, tekrar dene.',1)}$('#vout').value=v;gsay('Hazır ve doğrulandı. Bu metni config.js içindeki vault alanına yapıştır.')};
if(!C.vault||location.hash==='#kurulum'){$('#login').hidden=true;$('#setup').hidden=false}
else if(T)unlock();

async function load(){
  if(tok()){
    const r=await fetch(`${api}?ref=${C.branch}`,{headers:hdr()});
    if(r.ok){const j=await r.json();sha=j.sha;games=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))));return list()}
    say('GitHub\'a bağlanılamadı. Anahtarı ve config.js ayarlarını kontrol et.',1);
  }
  games=await fetch('games.json?'+Date.now()).then(r=>r.json()).catch(()=>[]);list();
}
async function persist(){
  if(!tok()){say('Önce GitHub anahtarını kaydet ya da games.json dosyasını indirip elle yükle.',1);return false}
  const bytes=new TextEncoder().encode(JSON.stringify(games,null,2));let b='';bytes.forEach(x=>b+=String.fromCharCode(x));
  const r=await fetch(api,{method:'PUT',headers:hdr(),body:JSON.stringify({message:'Oyun listesi güncellendi',content:btoa(b),branch:C.branch,sha})});
  if(!r.ok){say('Kaydedilemedi ('+r.status+'). Anahtarın "Contents: Read and write" iznine sahip olmalı.',1);return false}
  sha=(await r.json()).content.sha;say('Kaydedildi. Site birkaç saniye içinde güncellenir.');return true;
}
function list(){
  $('#list').innerHTML=games.map(g=>`<div class="li"><span>${esc(g.title)} <span class="meta">${ST[g.status||'bitirdim']}${g.score!=null&&g.score!==''?', '+esc(g.score)+'/10':''}</span></span><span><button class="btn" data-e="${esc(g.id)}">Düzenle</button> <button class="btn del" data-d="${esc(g.id)}">Sil</button></span></div>`).join('')||'<p class="meta">Henüz oyun yok.</p>';
}
$('#list').onclick=async e=>{
  const d=e.target.dataset.d,ed=e.target.dataset.e;
  if(d&&confirm('Bu oyun silinsin mi?')){const old=games;games=games.filter(g=>g.id!==d);if(await persist())list();else games=old}
  if(ed){const g=games.find(x=>x.id===ed);editId=ed;ids.forEach(i=>$('#'+i).value=g[i]??'');$('#genres').value=(g.genres||[]).join(', ');$('#status').value=g.status||'bitirdim';$('#rec').value=g.recommended===true?'1':g.recommended===false?'0':'';$('#ft').textContent='Oyunu düzenle';scrollTo({top:0,behavior:'smooth'})}
};
function clear(){editId=null;ids.forEach(i=>$('#'+i).value='');$('#genres').value='';$('#status').value='bitirdim';$('#rec').value='1';$('#ft').textContent='Oyun bilgileri'}
$('#clr').onclick=clear;
$('#add').onclick=async()=>{
  const stt=$('#status').value,val=i=>$('#'+i).value.trim();
  if(!val('title'))return say('Oyun adı zorunlu.',1);
  if(stt==='bitirdim'&&(val('score')===''||val('hours')===''||!val('finished')))return say('Bitirdiğin oyunlarda puan, süre ve tarih zorunlu.',1);
  const n=i=>val(i)===''?null:+val(i);
  const g={id:editId||Date.now().toString(36),status:stt,title:val('title'),image:val('image'),platform:val('platform'),genres:val('genres').split(',').map(x=>x.trim()).filter(Boolean),score:n('score'),hours:n('hours'),finished:val('finished')||null,recommended:$('#rec').value===''?null:$('#rec').value==='1',review:val('review'),note:val('note')};
  const old=games;games=editId?games.map(x=>x.id===editId?g:x):[g,...games];
  if(await persist()){clear();list()}else games=old;
};
$('#go').onclick=async()=>{
  const q=$('#s').value.trim();if(!q)return;
  const r=await fetch(`https://api.rawg.io/api/games?key=${C.rawgKey}&search_precise=true&page_size=6&search=${encodeURIComponent(q)}`).catch(()=>null);
  if(!r||!r.ok)return $('#res').textContent='Arama başarısız. RAWG anahtarını kontrol et.';
  const {results}=await r.json();
  $('#res').innerHTML=results.map((x,i)=>`<button data-i="${i}">${x.background_image?`<img src="${esc(x.background_image)}" alt="">`:''}<span>${esc(x.name)}<br><small>${(x.released||'').slice(0,4)}</small></span></button>`).join('')||'Sonuç yok.';
  $('#res').onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=results[b.dataset.i];$('#title').value=x.name;$('#image').value=x.background_image||'';$('#genres').value=(x.genres||[]).map(t=>TR[t.name]||t.name).join(', ');$('#platform').value=(x.platforms||[]).map(p=>p.platform.name)[0]||''};
};
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(games,null,2)],{type:'application/json'}));a.download='games.json';a.click()};
</script>
</body>
</html>
