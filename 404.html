<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#e9e8e0">
  <title>Sayfa bulunamadı · Günlüğüm</title>
  <script>
    (() => {
      const path = window.location.pathname;
      if (!/\.html$/i.test(path)) return;
      let cleanPath = path.replace(/\.html$/i, '/');
      if (/\/index\.html$/i.test(path)) cleanPath = path.replace(/index\.html$/i, '') || '/';
      window.location.replace(cleanPath + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    :root{color-scheme:dark;--bg:#11161b;--card:#1c232a;--line:#343e47;--ink:#edf2f6;--muted:#a8b3bd;--acc:#65c5ef}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#202b34,var(--bg) 58%);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,520px);padding:34px;border:1px solid var(--line);border-radius:20px;background:var(--card);text-align:center;box-shadow:0 24px 80px #0003}
    .mark{width:62px;height:62px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid var(--acc);border-radius:18px;color:var(--acc);font-size:32px;font-weight:800}
    h1{margin:0 0 10px;font-size:1.8rem}p{color:var(--muted);margin:0 0 22px}.btn{display:inline-flex;padding:10px 18px;border:1px solid var(--acc);border-radius:10px;background:var(--acc);color:#102024;font:inherit;font-weight:700;text-decoration:none}
  </style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atelier.css?v=2">
<link rel="stylesheet" href="assets/css/unified.css?v=2">
<link rel="stylesheet" href="assets/css/matte.css?v=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/archive-editorial.css?v=20261105-3">
<script src="scripts/site-nav.js?v=20261105" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">G</div>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Adres değişmiş veya sayfa kaldırılmış olabilir. Günlüğüm'ün ana sayfasından arşivlere ulaşabilirsin.</p>
    <a class="btn" href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
