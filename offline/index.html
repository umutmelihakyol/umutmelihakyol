<!doctype html>
<html lang="tr">
<head>

  <meta charset="utf-8">
<script>
(() => {
  const path = window.location.pathname;
  let cleanPath = path;
  if (/\/index\.html$/i.test(path)) cleanPath = path.replace(/index\.html$/i, '');
  else if (/\/offline\.html$/i.test(path)) cleanPath = path.replace(/offline\.html$/i, 'offline/');
  if (cleanPath !== path) {
    if (!cleanPath) cleanPath = '/';
    history.replaceState(history.state, '', cleanPath + window.location.search + window.location.hash);
  }
})();
</script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171d22">
  <title>Çevrimdışısın · Günlüğüm</title>
  <style>
    :root{color-scheme:dark;--bg:#171d22;--card:#20282f;--line:#35414a;--ink:#e8edf1;--muted:#aab5bf;--acc:#70b8c0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,520px);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--card);text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid var(--acc);border-radius:18px;color:var(--acc);font-size:32px;font-weight:800}
    h1{margin:0 0 10px;font-size:1.8rem}p{color:var(--muted);margin:0 0 20px}.btn{display:inline-flex;padding:10px 18px;border:1px solid var(--acc);border-radius:10px;background:var(--acc);color:#102024;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">G</div>
    <h1>Bağlantı yok</h1>
    <p>Günlüğüm'ün daha önce ziyaret ettiğin bazı sayfaları çevrimdışı açılabilir. Bu sayfa henüz önbelleğe alınmadıysa internete bağlanıp yeniden deneyebilirsin.</p>
    <button class="btn" type="button" onclick="location.reload()">Tekrar dene</button>
    <p style="margin:18px 0 0"><a href="/" style="color:var(--acc)">Ana sayfaya dön</a></p>
  </main>
</body>
</html>
