<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oyun Günlüğüm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">Oyun Günlüğüm</h1>
    <button class="btn" onclick="toggleTheme()" aria-label="Açık/koyu temayı değiştir">Tema</button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="pills" id="pills" role="group" aria-label="Duruma göre filtre"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Oyun ara…" aria-label="Oyun ara">
    <select id="plat" aria-label="Platform"></select>
    <select id="genre" aria-label="Tür"></select>
    <select id="flt" aria-label="Öneri filtresi">
      <option value="all">Öneri: hepsi</option><option value="yes">Önerdiklerim</option><option value="no">Önermediklerim</option><option value="rev">İncelemesi olanlar</option>
    </select>
    <select id="sort" aria-label="Sıralama">
      <option value="date">En son bitirilen</option><option value="score">En yüksek puan</option><option value="hours">En uzun süre</option><option value="name">A-Z</option>
    </select>
  </div>
  <main class="grid" id="grid"></main>
  <footer class="foot"><a href="admin.html">Yönetim</a></footer>
</div>
<dialog id="dlg" aria-label="Oyun ayrıntıları"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const fmtDate=d=>d?new Date(d).toLocaleDateString('tr-TR',{year:'numeric',month:'long'}):'—';
const num=v=>(+v).toLocaleString('tr',{maximumFractionDigits:1});
const has=v=>v!==null&&v!==undefined&&v!=='';
const ST={bitirdim:'Bitirdim',oynuyorum:'Oynuyorum',biraktim:'Yarım bıraktım',istek:'İstek listesi'};
const stOf=g=>g.status||'bitirdim';
const plats=g=>String(g.platform||'').split(',').map(x=>x.trim()).filter(Boolean);
let games=[],st='all';
document.title=$('#title').textContent=(window.CONFIG&&CONFIG.siteTitle)||'Oyun Günlüğüm';

function fillSel(id,label,vals){$(id).innerHTML=`<option value="">${label}</option>`+[...new Set(vals)].sort((a,b)=>a.localeCompare(b,'tr')).map(v=>`<option>${esc(v)}</option>`).join('')}
function render(){
  const q=$('#q').value.trim().toLocaleLowerCase('tr'),pf=$('#plat').value,gf=$('#genre').value,f=$('#flt').value,s=$('#sort').value;
  const l=games.filter(g=>g.title.toLocaleLowerCase('tr').includes(q)&&(st==='all'||stOf(g)===st)&&(!pf||plats(g).includes(pf))&&(!gf||(g.genres||[]).includes(gf))
    &&(f==='all'||(f==='yes'&&g.recommended===true)||(f==='no'&&g.recommended===false)||(f==='rev'&&g.review)));
  const v=(g,k)=>has(g[k])?+g[k]:-1;
  l.sort((a,b)=>s==='score'?v(b,'score')-v(a,'score'):s==='hours'?v(b,'hours')-v(a,'hours'):s==='name'?a.title.localeCompare(b.title,'tr'):(b.finished||'').localeCompare(a.finished||''));
  $('#grid').innerHTML=l.length?l.map(card).join(''):'<p class="empty">Gösterilecek oyun yok.</p>';
  $('#grid').querySelectorAll('.card').forEach(c=>{const n=c.querySelector('.note');if(n.scrollHeight>n.clientHeight+1)c.querySelector('.more').textContent='Devamını oku'});
  $('#pills').innerHTML=['all',...Object.keys(ST)].map(k=>`<button class="pill" data-k="${k}" aria-pressed="${st===k}">${k==='all'?'Hepsi':ST[k]} <span>${k==='all'?games.length:games.filter(g=>stOf(g)===k).length}</span></button>`).join('');
  const fin=games.filter(g=>stOf(g)==='bitirdim'),sc=games.filter(g=>has(g.score));
  const h=fin.reduce((t,g)=>t+(+g.hours||0),0),avg=sc.length?sc.reduce((t,g)=>t+ +g.score,0)/sc.length:0;
  $('#stats').innerHTML=`<div><b>${fin.length}</b>bitirilen oyun</div><div><b>${h.toLocaleString('tr')}</b>saat</div><div><b>${avg.toFixed(1)}</b>ortalama puan</div><div><b>${games.filter(g=>g.recommended===true).length}</b>önerilen</div>`;
}
const recChip=g=>g.recommended===true?'<span class="recb yes">Öneriyorum</span>':g.recommended===false?'<span class="recb no">Önermiyorum</span>':'';
const revHtml=g=>{const r=safeUrl(g.review);return r?`<a href="${r}" target="_blank" rel="noopener">İncelemeyi oku</a>`:stOf(g)==='istek'?'':'<span class="none">İnceleme yok</span>'};
const NOF={bitirdim:'Süre ve tarih girilmemiş',oynuyorum:'Şu an oynuyorum',biraktim:'Yarım bıraktım',istek:'Henüz oynamadım'};
const facts=g=>{const p=[];if(has(g.hours))p.push(`<span><i>Süre</i>${esc(g.hours)} saat</span>`);if(g.finished)p.push(`<span><i>Bitiş</i>${fmtDate(g.finished)}</span>`);return `<p class="facts">${p.join('')||`<span>${NOF[stOf(g)]}</span>`}</p>`};
const chips=g=>(g.genres||[]).map(t=>`<span>${esc(t)}</span>`).join('');
const cover=g=>`<div class="cover">${g.image?`<img src="${safeUrl(g.image)}" alt="${esc(g.title)} kapak görseli" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<span class="stb s-${stOf(g)}">${ST[stOf(g)]}</span>${has(g.score)?`<span class="score" title="Puanım">${num(g.score)}</span>`:''}${recChip(g)}</div>`;
function card(g){
  return `<article class="card" data-id="${esc(g.id)}">${cover(g)}
  <div class="body"><h3><a class="tl" href="#${esc(g.id)}" title="${esc(g.title)}">${esc(g.title)}</a></h3>
  <div class="sub"><span class="plat">${esc(g.platform)}</span><span class="tags">${chips(g)}</span></div>
  ${facts(g)}<p class="note${g.note?'':' none'}">${g.note?esc(g.note):'Henüz not eklenmemiş.'}</p>
  <div class="row"><a class="more" href="#${esc(g.id)}">Ayrıntılar</a>${revHtml(g)}</div></div></article>`;
}
function openGame(id){
  const g=games.find(x=>x.id===id),d=$('#dlg');if(!g)return d.open&&d.close();
  d.innerHTML=`${cover(g)}<div class="inner"><h2>${esc(g.title)}</h2><p class="meta">${esc(g.platform)}</p>
  <p class="tags wrapt">${chips(g)}</p>${facts(g)}
  ${g.note?`<p class="full">${esc(g.note)}</p>`:''}<div class="row">${revHtml(g)}</div>
  <p><button class="btn copy">Bağlantıyı kopyala</button> <button class="btn" onclick="this.closest('dialog').close()">Kapat</button></p></div>`;
  if(!d.open)d.showModal();
}
$('#dlg').addEventListener('close',()=>history.replaceState(null,'',location.pathname+location.search));
$('#dlg').addEventListener('click',e=>{
  if(e.target===e.currentTarget)return e.currentTarget.close();
  const b=e.target.closest('.copy');if(b)navigator.clipboard.writeText(location.href).then(()=>b.textContent='Kopyalandı',()=>prompt('Bağlantı:',location.href));
});
$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c||e.target.closest('a[target]'))return;
  e.preventDefault();location.hash=c.dataset.id;openGame(c.dataset.id);
});
addEventListener('hashchange',()=>openGame(location.hash.slice(1)));
$('#pills').addEventListener('click',e=>{const b=e.target.closest('.pill');if(b){st=b.dataset.k;render()}});
['q','plat','genre','flt','sort'].forEach(i=>$('#'+i).addEventListener('input',render));
addEventListener('resize',()=>games.length&&render());
fetch('games.json?'+Date.now()).then(r=>r.json()).then(d=>{
  games=d;fillSel('#plat','Tüm platformlar',d.flatMap(plats));fillSel('#genre','Tüm türler',d.flatMap(g=>g.genres||[]));
  render();if(location.hash)openGame(location.hash.slice(1));
}).catch(()=>{$('#grid').innerHTML='<p class="empty">games.json yüklenemedi.</p>'});
</script>
</body>
</html>
