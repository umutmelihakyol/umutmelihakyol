<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Günlüğüm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="categories.js"></script>
<script>if(window.CONFIG&&CONFIG.goatcounter){var gc=document.createElement('script');gc.async=true;gc.dataset.goatcounter='https://'+CONFIG.goatcounter+'.goatcounter.com/count';gc.src='https://gc.zgo.at/count.js';document.head.appendChild(gc)}</script>
</head>
<body class="home">
<div class="wrap">
  <header class="top">
    <h1 id="title"></h1>
    <div class="acts">
      <a class="btn ico" id="suggest" href="#" target="_blank" rel="noopener" hidden title="Bana öneri bırak">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.6.5 1 1.300 1 2.100h5c0-.8.4-1.600 1-2.100A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl">Bana öner</span>
      </a>
      <a class="btn ico" href="admin.html" title="Yönetim paneli">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span class="lbl">Yönetim</span>
      </a>
      <button class="btn ico round" id="themeBtn" onclick="toggleTheme()" title="Açık/koyu tema" aria-label="Açık veya koyu temaya geç">
        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <section class="hero"><h2 id="tagline"></h2></section>
  <nav class="tiles" id="tiles" aria-label="Kategoriler"></nav>
  <section id="recentWrap" hidden><h2 class="sech">Son eklenenler</h2><div class="recent" id="recent"></div></section>
  <footer class="foot" id="foot"></footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const has=v=>v!==null&&v!==undefined&&v!=='';
const CF=window.CONFIG||{};
if(location.hash.length>1)location.replace('oyun.html'+location.hash);
document.title=$('#title').textContent=CF.siteTitle||'Günlüğüm';
$('#tagline').textContent=CF.tagline||'Oynadığım, izlediğim her şey tek yerde.';
if(CF.suggestUrl){const a=$('#suggest');a.href=CF.suggestUrl;a.hidden=false;if(!/^https?:/i.test(CF.suggestUrl))a.removeAttribute('target')}
const stamp=g=>g.updatedAt||g.finished||'';
function tiles(D){
  $('#tiles').innerHTML=Object.entries(CATS).map(([k,c])=>{const l=D[k];
    return `<a class="tile" href="${c.page}"><span class="ticon">${ICON(k)}</span><span class="tbody"><h3>${c.plural}</h3><p>${l?(l.length?l.length+' '+c.noun:'Henüz kayıt yok'):'Yükleniyor…'}</p></span></a>`}).join('');
}
tiles({});
Promise.all(Object.entries(CATS).map(async([k,c])=>[k,await fetch(c.file+'?'+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[])])).then(res=>{
  const D=Object.fromEntries(res);tiles(D);
  const all=res.flatMap(([k,l])=>l.map(g=>({k,g}))).sort((a,b)=>stamp(b.g).localeCompare(stamp(a.g))).slice(0,8);
  $('#recentWrap').hidden=!all.length;
  $('#recent').innerHTML=all.map(({k,g})=>`<a class="rc" href="${CATS[k].page}#${esc(g.id)}">${g.image?`<img class="sth" src="${safeUrl(g.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'<span class="sth ph"></span>'}<span><b>${esc(g.title)}</b><small>${CATS[k].name}${has(g.score)?', puan '+(+g.score).toLocaleString('tr',{maximumFractionDigits:1}):''}</small></span></a>`).join('');
  const u=res.flatMap(([k,l])=>l.map(g=>g.updatedAt)).filter(Boolean).sort().pop();
  $('#foot').textContent=u?'Son güncelleme: '+new Date(u).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):'';
});
</script>
</body>
</html>
